# Used only to write a new migration:
#   alembic revision --autogenerate -m "what changed"
# The API applies the migrations itself when it starts (python -m library_api.migrate).
# The database URL comes from the settings (.env or environment variables).
[alembic]
script_location = src/library_api/migrations
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
