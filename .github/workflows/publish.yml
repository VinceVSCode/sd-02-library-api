name: Publish image

# Publishes the API's Docker image to GitHub's container registry:
# ghcr.io/vincevscode/sd-02-library-api:<version>. Other projects, such as SD-03, pull it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to publish, such as v1.0.1"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      IMAGE: ghcr.io/vincevscode/sd-02-library-api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Sign in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build the image
        run: |
          VERSION="${TAG#v}"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.licenses=MIT" \
            --tag "$IMAGE:$VERSION" .
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check that the image starts and answers
        run: |
          cp .env.example .env
          docker compose up --detach --wait db
          docker run --rm --detach --name api --network "$(basename "$PWD")_default" \
            --env-file .env -e POSTGRES_HOST=db -p 8000:8000 "$IMAGE:$VERSION"
          for i in $(seq 30); do curl -fs http://localhost:8000/health && break; sleep 2; done
          curl -fs http://localhost:8000/health
          docker stop api
          docker compose down --volumes

      - name: Publish
        run: docker push "$IMAGE:$VERSION"
